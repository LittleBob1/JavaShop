<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Управление товарами</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
<div th:fragment="content">
<div class="container mt-4">
  <h1>Управление товарами</h1>
  <div class="mb-4">
    <h3>Список товаров</h3>
    <table class="table">
      <thead>
      <tr>
        <th>Название</th>
        <th>Описание</th>
        <th>Цена</th>
        <th>Бренд</th>
        <th>Действия</th>
      </tr>
      </thead>
      <tbody id="product-table-body"></tbody>
    </table>
  </div>

  <div class="mb-4">
    <h3>Добавить товар</h3>
    <form id="add-product-form">
      <div class="mb-3">
        <label for="name" class="form-label">Название</label>
        <input type="text" id="name" name="name" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="description" class="form-label">Описание</label>
        <input type="text" id="description" name="description" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="price" class="form-label">Цена</label>
        <input type="number" id="price" name="price" class="form-control" step="0.01" required>
      </div>
      <div class="mb-3">
        <label for="brandId" class="form-label">Бренд</label>
        <select id="brandId" name="brandId" class="form-select" required>
          <option value="" disabled selected>Выберите бренд</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary">Сохранить</button>
    </form>
  </div>
</div>
  <div class="modal fade" id="editProductModal" tabindex="-1" aria-labelledby="editProductModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editProductModalLabel">Редактировать товар</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
        </div>
        <div class="modal-body">
          <form id="edit-product-form">
            <div class="mb-3">
              <label for="editProductName" class="form-label">Название</label>
              <input type="text" id="editProductName" name="name" class="form-control" required>
            </div>
            <div class="mb-3">
              <label for="editProductDescription" class="form-label">Описание</label>
              <input type="text" id="editProductDescription" name="description" class="form-control" required>
            </div>
            <div class="mb-3">
              <label for="editProductPrice" class="form-label">Цена</label>
              <input type="number" id="editProductPrice" name="price" class="form-control" step="0.01" required>
            </div>
            <div class="mb-3">
              <label for="editProductBrand" class="form-label">Бренд</label>
              <select id="editProductBrand" name="brandId" class="form-select" required>
                <option value="" disabled>Выберите бренд</option>
              </select>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
          <button type="button" class="btn btn-primary" id="save-edit-button">Сохранить</button>
        </div>
      </div>
    </div>
  </div>
<script src="/js/products.js"></script>
<script>
  const brandSelect = document.getElementById('brandId');
  axios.get('/api/brands').then(response => {
    const brands = response.data;
    brands.forEach(brand => {
      const option = document.createElement('option');
      option.value = brand.id;
      option.textContent = brand.name;
      brandSelect.appendChild(option);
    });
  }).catch(error => console.error('Ошибка загрузки брендов:', error));
</script>
</div>
</body>
</html>
