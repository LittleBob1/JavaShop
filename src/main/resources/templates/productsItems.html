<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Управление позициями товаров</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
<div th:fragment="content">
  <div class="container mt-4">
    <h1>Управление позициями</h1>
    <div class="mb-4">
      <h3>Список позиций</h3>
      <table class="table">
        <thead>
        <tr>
          <th>Название</th>
          <th>Количество</th>
          <th>Размер</th>
          <th>Товар</th>
        </tr>
        </thead>
        <tbody id="productItem-table-body"></tbody>
      </table>
    </div>

    <div class="mb-4">
      <h3>Добавить позицию</h3>
      <form id="add-productItem-form">
        <div class="mb-3">
          <label for="name" class="form-label">Название</label>
          <input type="text" id="name" name="name" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="quantity" class="form-label">Количество</label>
          <input type="number" id="quantity" name="quantity" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="sizeId" class="form-label">Размер</label>
          <select id="sizeId" name="sizeId" class="form-select" required>
            <option value="" disabled selected>Выберите размер</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="productId" class="form-label">Товар</label>
          <select id="productId" name="productId" class="form-select" required>
            <option value="" disabled selected>Выберите товар</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary">Сохранить</button>
      </form>
    </div>
  </div>
  <div class="modal fade" id="editProductItemModal" tabindex="-1" aria-labelledby="editProductItemModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editProductItemModalLabel">Редактировать позицию</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
        </div>
        <div class="modal-body">
          <form id="edit-productItem-form">
            <div class="mb-3">
              <label for="editProductItemName" class="form-label">Название</label>
              <input type="text" id="editProductItemName" name="name" class="form-control" required>
            </div>
            <div class="mb-3">
              <label for="editProductItemQuantity" class="form-label">Количество</label>
              <input type="number" id="editProductItemQuantity" name="quantity" class="form-control" required>
            </div>
            <div class="mb-3">
              <label for="editProductItemSizeId" class="form-label">Размер</label>
              <select id="editProductItemSizeId" name="sizeId" class="form-select" required>
                <option value="" disabled selected>Выберите размер</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="editProductItemProductId" class="form-label">Товар</label>
              <select id="editProductItemProductId" name="productId" class="form-select" required>
                <option value="" disabled selected>Выберите товар</option>
              </select>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
          <button type="button" class="btn btn-primary" id="save-edit-button">Сохранить</button>
        </div>
      </div>
    </div>
  </div>
  <script src="/js/productsItems.js"></script>
  <script>
    const sizeSelect = document.getElementById('sizeId');
    axios.get('/api/sizes').then(response => {
      const sizes = response.data;
      sizes.forEach(size => {
        const option = document.createElement('option');
        option.value = size.id;
        option.textContent = size.name;
        sizeSelect.appendChild(option);
      });
    }).catch(error => console.error('Ошибка загрузки размеров:', error));
  </script>
  <script>
    const productSelect = document.getElementById('productId');
    axios.get('/api/products').then(response => {
      const products = response.data;
      products.forEach(product => {
        const option = document.createElement('option');
        option.value = product.id;
        option.textContent = product.name;
        productSelect.appendChild(option);
      });
    }).catch(error => console.error('Ошибка загрузки товоров:', error));
  </script>
</div>
</body>
</html>
