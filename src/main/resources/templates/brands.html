<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Управление брендами</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div th:fragment="content">
  <div class="container mt-4">
    <h1>Управление брендами</h1>
    <div class="mb-4">
      <h3>Список брендов</h3>
      <table class="table">
        <thead>
        <tr>
          <th>Название</th>
          <th>Действия</th>
        </tr>
        </thead>
        <tbody id="brand-table-body">
        </tbody>
      </table>
    </div>

    <div class="mb-4">
      <h3>Добавить бренд</h3>
      <form id="create-brand-form">
        <div class="mb-3">
          <label for="brandName" class="form-label">Название бренда</label>
          <input type="text" id="brandName" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Создать</button>
      </form>
    </div>
  </div>
  <div class="modal fade" id="editBrandModal" tabindex="-1" aria-labelledby="editBrandModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editBrandModalLabel">Редактировать бренд</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
        </div>
        <div class="modal-body">
          <form id="edit-size-form">
            <div class="mb-3">
              <label for="editBrandName" class="form-label">Новое название</label>
              <input type="text" id="editBrandName" class="form-control" required>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
          <button type="button" class="btn btn-primary" id="save-edit-button">Сохранить</button>
        </div>
      </div>
    </div>
  </div>
  <script th:src="@{/js/brands.js}"></script>
</div>
</body>
</html>
