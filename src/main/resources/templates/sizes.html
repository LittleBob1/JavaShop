<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Управление размерами</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div th:fragment="content">
    <div class="container mt-4">
        <h1>Управление размерами</h1>
        <div class="mb-4">
            <h3>Список размеров</h3>
            <table class="table">
                <thead>
                <tr>
                    <th>Название</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody id="size-table-body">
                </tbody>
            </table>
        </div>

        <div class="mb-4">
            <h3>Добавить размер</h3>
            <form id="create-size-form">
                <div class="mb-3">
                    <label for="sizeName" class="form-label">Название размера</label>
                    <input type="text" id="sizeName" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary">Создать</button>
            </form>
        </div>
    </div>
    <div class="modal fade" id="editSizeModal" tabindex="-1" aria-labelledby="editSizeModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editSizeModalLabel">Редактировать размер</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                </div>
                <div class="modal-body">
                    <form id="edit-size-form">
                        <div class="mb-3">
                            <label for="editSizeName" class="form-label">Новое название</label>
                            <input type="text" id="editSizeName" class="form-control" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-primary" id="save-edit-button">Сохранить</button>
                </div>
            </div>
        </div>
    </div>
    <script th:src="@{/js/sizes.js}"></script>
</div>
</body>
</html>
