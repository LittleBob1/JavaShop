<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Управление заказами</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
<div th:fragment="content">
    <div class="container mt-4">
        <h1>Управление заказами</h1>
        <div class="mb-4">
            <h3>Список заказов</h3>
            <table class="table">
                <thead>
                <tr>
                    <th>Дата</th>
                    <th>Статус</th>
                    <th>Имя покупателя</th>
                    <th>Имя продавца</th>
                    <th>Позиция</th>
                    <th>Количество</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody id="order-table-body"></tbody>
            </table>
        </div>

        <div class="mb-4">
            <h3>Добавить заказ</h3>
            <form id="add-order-form">
                <div class="mb-3">
                    <label for="date" class="form-label">Дата</label>
                    <input type="date" id="date" name="date" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="status" class="form-label">Статус</label>
                    <input type="text" id="status" name="status" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="sellerId" class="form-label">Продавец</label>
                    <select id="sellerId" name="sellerId" class="form-select" required>
                        <option value="1">Тестовый продавец</option>
                        <option value="" disabled selected>Выберите продавца</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="buyerId" class="form-label">Покупатель</label>
                    <select id="buyerId" name="buyerId" class="form-select" required>
                        <option value="" disabled selected>Выберите покупателя</option>
                    </select>
                </div>
                <div id="order-items-container" class="mb-4">
                    <h4>Позиции заказа</h4>
                    <div class="order-item-row mb-3" id="order-item-template" style="display: none;">
                        <div class="row g-3 align-items-center">
                            <div class="col-md-5">
                                <select class="form-select product-item-select" >
                                    <option value="" disabled selected>Выберите позицию</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <input type="number" class="form-control quantity-input" placeholder="Количество" >
                            </div>
                            <div class="col-md-2">
                                <button type="button" class="btn btn-danger remove-item-btn">Удалить</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row-cols-2">
                    <button type="button" id="add-item-btn" class="btn btn-secondary mb-3">Добавить позицию</button>
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal fade" id="editOrderModal" tabindex="-1" aria-labelledby="editOrderModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editOrderModalLabel">Редактировать заказ</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                </div>
                <div class="modal-body">
                    <form id="edit-order-form">
                        <div class="mb-3">
                            <label for="editOrderDate" class="form-label">Дата</label>
                            <input type="date" id="editOrderDate" name="editOrderDate" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="editOrderStatus" class="form-label">Статус</label>
                            <input type="text" id="editOrderStatus" name="editOrderStatus" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="editOrderBuyerId" class="form-label">Покупатель</label>
                            <select id="editOrderBuyerId" name="editOrderBuyerId" class="form-select" required>
                                <option value="" disabled selected>Выберите покупателя</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="editOrderUserId" class="form-label">Продавец</label>
                            <select id="editOrderUserId" name="editOrderUserId" class="form-select" required>
                                <option value="" disabled selected>Выберите продавца</option>
                            </select>
                        </div>
                        <div id="edit-order-items-container" class="mb-4">
                            <h4>Позиции заказа</h4>
                            <div class="order-item-row mb-3" id="edit-order-item-template" style="display: none;">
                                <div class="row g-3 align-items-center">
                                    <div class="col-md-5">
                                        <select class="form-select edit-product-item-select" required>
                                            <option value="" disabled selected>Выберите позицию</option>
                                        </select>
                                    </div>
                                    <div class="col-md-3">
                                        <input type="number" class="form-control edit-quantity-input" placeholder="Количество" required>
                                    </div>
                                    <div class="col-md-2">
                                        <button type="button" class="btn btn-danger remove-item-btn">Удалить</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <button type="button" id="edit-add-item-btn" class="btn btn-secondary mb-3">Добавить позицию</button>

                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-primary" id="save-edit-button">Сохранить</button>
                </div>
            </div>
        </div>
    </div>
    <script src="/js/orders.js"></script>
</div>
</body>
</html>
