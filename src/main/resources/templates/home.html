<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Домашняя страница</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .chart-container {
            width: 80%;
            margin: 50px auto;
        }
    </style>
</head>
<body>
<div th:fragment="content">
<div class="container">
    <section class="mb-4">
        <h2>Работу выполнила:</h2>
        <p>Студентка группы ДПИ22-2, Сирина Яна</p>
    </section>

    <section class="chart-container">
        <h2 class="text-center">Продажи по датам</h2>
        <canvas id="salesChart"></canvas>
    </section>
</div>

<script>
    document.addEventListener("DOMContentLoaded", async () => {
        const apiUrl = "api/orders/salesCountByDate"; // Адрес API

        try {
            // Получение данных с сервера
            const response = await fetch(apiUrl);
            const data = await response.json();

            // Форматирование данных для графика
            const labels = data.map(item => new Date(item.salesDay).toLocaleDateString()); // Форматирование дат
            const salesCounts = data.map(item => item.salesCount);

            // Настройка графика
            const ctx = document.getElementById('salesChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar', // Тип графика: bar, line, pie, etc.
                data: {
                    labels: labels, // Даты
                    datasets: [{
                        label: 'Количество продаж',
                        data: salesCounts, // Продажи
                        backgroundColor: 'rgba(75, 192, 192, 0.2)', // Цвет фона
                        borderColor: 'rgba(75, 192, 192, 1)', // Цвет границы
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top'
                        }
                    },
                    scales: {
                        x: {
                            title: {
                                display: true,
                                text: 'Дата'
                            }
                        },
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Продажи'
                            }
                        }
                    }
                }
            });
        } catch (error) {
            console.error("Ошибка загрузки данных:", error);
        }
    });
</script>
</div>
</body>
</html>
