<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Управление покупателями</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div th:fragment="content">
  <div class="container mt-4">
    <h1>Управление покупателями</h1>
    <div class="mb-4">
      <h3>Список покупателей</h3>
      <table class="table">
        <thead>
        <tr>
          <th>Имя</th>
          <th>Почта</th>
          <th>Телефон</th>
          <th>Действия</th>
        </tr>
        </thead>
        <tbody id="buyer-table-body">
        </tbody>
      </table>
    </div>

    <div class="mb-4">
      <h3>Добавить покупателя</h3>
      <form id="create-buyer-form">
        <div class="mb-3">
          <label for="buyerName" class="form-label">Имя покупателя</label>
          <input type="text" id="buyerName" class="form-control" required>
          <label for="buyerEmail" class="form-label">Почта покупателя</label>
          <input type="text" id="buyerEmail" class="form-control" required>
          <label for="buyerPhone" class="form-label">Телефон покупателя</label>
          <input type="text" id="buyerPhone" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Создать</button>
      </form>
    </div>
  </div>
  <div class="modal fade" id="editBuyerModal" tabindex="-1" aria-labelledby="editBuyerModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editBuyerModalLabel">Редактировать покупателя</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
        </div>
        <div class="modal-body">
          <form id="edit-size-form">
            <div class="mb-3">
              <label for="editBuyerName" class="form-label">Имя покупателя</label>
              <input type="text" id="editBuyerName" class="form-control" required>
              <label for="editBuyerEmail" class="form-label">Почта покупателя</label>
              <input type="text" id="editBuyerEmail" class="form-control" required>
              <label for="editBuyerPhone" class="form-label">Телефон покупателя</label>
              <input type="text" id="editBuyerPhone" class="form-control" required>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
          <button type="button" class="btn btn-primary" id="save-edit-button">Сохранить</button>
        </div>
      </div>
    </div>
  </div>
  <script th:src="@{/js/buyers.js}"></script>
</div>
</body>
</html>
